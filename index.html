<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPC-ALD & BPC-LOS — Videocast přednášek a cvičení</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --border: #d0cdc6; --border-hover: #b0aca3;
      --text-primary: #1a1a18; --text-secondary: #4a4945; --text-muted: #8a8984; --accent: #185fa5;
    }
    [data-theme="dark"] {
      --bg: #1c1c1a; --surface: #2e2e2b; --border: #3a3936; --border-hover: #525250;
      --text-primary: #f0efe9; --text-secondary: #b8b7b2; --text-muted: #6b6a65; --accent: #5aa3e8;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-primary);
           line-height: 1.6; min-height: 100vh; transition: background 0.2s, color 0.2s; }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); position: relative; }
    header h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    header p { font-size: 14px; color: var(--text-secondary); }
    header a { color: var(--accent); text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .theme-toggle { position: absolute; top: 1rem; right: 1rem; background: var(--surface); border: 1px solid var(--border);
      border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 18px; transition: all 0.2s; color: var(--text-primary); }
    .theme-toggle:hover { background: var(--border-hover); transform: scale(1.05); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .course { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.5rem; color: inherit; text-decoration: none; transition: border-color 0.15s, transform 0.15s; }
    .course:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .course h2 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
    .course p { font-size: 14px; color: var(--text-secondary); }
    .course .go { margin-top: 12px; font-size: 13px; color: var(--accent); }
    footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Videocast přednášek a cvičení</h1>
    <p>Ing. Petr Petyovský, Ph.D. · <a href="https://www.vut.cz" target="_blank">VUT v Brně</a></p>
    <button class="theme-toggle" id="themeToggle" title="Přepnout tmavý/světlý režim"><span id="themeIcon">🌙</span></button>
  </header>

  <div class="grid">
    <a class="course" href="ald.html">
      <h2>BPC-ALD</h2>
      <p>Algoritmy a datové struktury · přednášky a cvičení 2021–2022</p>
      <div class="go">Otevřít →</div>
    </a>
    <a class="course" href="los.html">
      <h2>BPC-LOS</h2>
      <p>Logické obvody a systémy · přednášky a cvičení 2020–2021</p>
      <div class="go">Otevřít →</div>
    </a>
  </div>

  <footer>
    Web vytvořil: Jakub Sláma
  </footer>
</div>
<script>
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeIcon').textContent = t==='dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});
(function(){
  let saved;
  try { saved = localStorage.getItem('theme'); } catch(e) {}
  applyTheme(saved === 'dark' || saved === 'light' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
})();
</script>
</body>
</html>
